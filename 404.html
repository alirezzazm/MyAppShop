<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — MyAppShop</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236c5ce7'/><path d='M28 68V32h10l12 20 12-20h10v36H62V49L52 66h-4L38 49v19z' fill='white'/></svg>">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
<style>
  .nf { min-height: 100vh; display: grid; place-content: center; text-align: center; gap: 18px; padding: 40px 24px; }
  .nf-code { font-size: clamp(4rem, 16vw, 9rem); font-weight: 800; letter-spacing: -.05em; line-height: 1;
             background: linear-gradient(110deg, var(--brand), var(--brand-2), var(--brand-3));
             -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nf h1 { font-size: clamp(1.3rem, 3.5vw, 2rem); }
  .nf p { color: var(--text-dim); max-width: 42ch; margin-inline: auto; }
  .nf .btn { justify-self: center; margin-top: 8px; }
</style>
</head>
<body>
<div class="bg-aurora" aria-hidden="true">
  <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
  <div class="grid-lines"></div>
</div>
<main class="nf">
  <div class="nf-code">404</div>
  <h1>This page does not exist</h1>
  <p>The link may be out of date, or the page may have moved. Everything else is one click away.</p>
  <a class="btn btn-primary btn-lg" href="./">Back to the home page</a>
</main>
<script>
  // Keep the visitor's theme choice on the error page too.
  try {
    var saved = localStorage.getItem('mas.theme');
    var light = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.setAttribute('data-theme', saved || (light ? 'light' : 'dark'));
  } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
</script>
</body>
</html>
